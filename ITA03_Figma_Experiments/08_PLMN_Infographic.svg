<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="100%" height="100%" fill="#F5F7FB"/><text x="40" y="48" font-family="Inter,Arial" font-size="30" font-weight="700" fill="#172033">08 · Public Land Mobile Network (PLMN)</text><text x="42" y="78" font-family="Inter,Arial" font-size="15" fill="#64748B">Structure, identity, roaming, interconnect and subscriber services</text><path d="M40 100 H1400" stroke="#CBD5E1"/><rect x="45" y="135" width="390" height="125" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="45" y="135" width="6" height="125" rx="3" fill="#2563EB"/><text x="63" y="163" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start">PLMN</text><text x="63" y="188" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Public land mobile network provides mobile voice, messaging and data services.</text><rect x="475" y="135" width="440" height="125" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="475" y="135" width="6" height="125" rx="3" fill="#7C3AED"/><text x="493" y="163" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#7C3AED" text-anchor="start">PLMN identity</text><text x="493" y="188" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">MCC (3 digits) + MNC (2 or 3 digits). Example MCC 404 = India; include the operator MNC.</text><rect x="955" y="135" width="420" height="125" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="955" y="135" width="6" height="125" rx="3" fill="#15803D"/><text x="973" y="163" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#15803D" text-anchor="start">Services</text><text x="973" y="188" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Voice · SMS · Data</text><text x="45" y="330" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#172033" text-anchor="start">NETWORK STRUCTURE</text><rect x="45" y="380" width="280" height="85" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="185.0" y="427.5" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">Mobile Station</text><rect x="385" y="380" width="280" height="85" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="525.0" y="427.5" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">Radio Access Network (RAN)</text><path d="M325 422 L385 422" stroke="#94A3B8" stroke-width="2" fill="none"/><rect x="725" y="380" width="280" height="85" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="865.0" y="427.5" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">Core Network</text><path d="M665 422 L725 422" stroke="#94A3B8" stroke-width="2" fill="none"/><rect x="1065" y="380" width="280" height="85" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="1205.0" y="427.5" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">Services / PSTN / Internet</text><path d="M1005 422 L1065 422" stroke="#94A3B8" stroke-width="2" fill="none"/><rect x="130" y="560" width="430" height="125" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="130" y="560" width="6" height="125" rx="3" fill="#0891B2"/><text x="148" y="588" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#0891B2" text-anchor="start">HPLMN</text><text x="148" y="613" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Home PLMN: network where the subscriber is registered.</text><rect x="630" y="560" width="430" height="125" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="630" y="560" width="6" height="125" rx="3" fill="#7C3AED"/><text x="648" y="588" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#7C3AED" text-anchor="start">VPLMN</text><text x="648" y="613" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Visited PLMN: network used while roaming.</text><path d="M560 620 L630 620" stroke="#B45309" stroke-width="3" fill="none"/><rect x="130" y="720" width="930" height="100" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="130" y="720" width="6" height="100" rx="3" fill="#B45309"/><text x="148" y="748" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#B45309" text-anchor="start">Interconnect</text><text x="148" y="773" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Roaming agreements and signalling between operators; RAN, core network, billing and OSS.</text></svg>