<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="100%" height="100%" fill="#F5F7FB"/><text x="40" y="48" font-family="Inter,Arial" font-size="30" font-weight="700" fill="#172033">01 · Interactive Diagram of a Basic Cellular System</text><text x="42" y="78" font-family="Inter,Arial" font-size="15" fill="#64748B">Seven-cell cluster, BTS/MS, BSC, MSC, HLR/VLR and PSTN</text><path d="M40 100 H1400" stroke="#CBD5E1"/><polygon points="225,220 275,248 275,304 225,332 175,304 175,248" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="225" y="242" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">1</text><text x="225" y="285" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">BTS</text><polygon points="385,220 435,248 435,304 385,332 335,304 335,248" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="385" y="242" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">2</text><text x="385" y="285" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">BTS</text><polygon points="305,358 355,386 355,442 305,470 255,442 255,386" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="305" y="380" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">3</text><text x="305" y="423" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">BTS</text><polygon points="145,358 195,386 195,442 145,470 95,442 95,386" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="145" y="380" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">4</text><text x="145" y="423" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">BTS</text><polygon points="465,358 515,386 515,442 465,470 415,442 415,386" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="465" y="380" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">5</text><text x="465" y="423" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">BTS</text><polygon points="225,496 275,524 275,580 225,608 175,580 175,524" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="225" y="518" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">6</text><text x="225" y="561" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">BTS</text><polygon points="385,496 435,524 435,580 385,608 335,580 335,524" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="385" y="518" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">7</text><text x="385" y="561" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">BTS</text><rect x="175" y="270" width="110" height="42" rx="14" fill="#DCFCE7" stroke="#CBD5E1"/><rect x="175" y="270" width="6" height="42" rx="3" fill="#15803D"/><text x="193" y="298" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#15803D" text-anchor="start">MS + SIM</text><text x="193" y="323" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start"></text><text x="430" y="280" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#64748B" text-anchor="start">Um · radio link</text><rect x="650" y="190" width="160" height="70" rx="14" fill="#CFFAFE" stroke="#CBD5E1"/><rect x="650" y="190" width="6" height="70" rx="3" fill="#0891B2"/><text x="668" y="218" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#0891B2" text-anchor="start">BSC</text><text x="668" y="243" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Controls BTSs</text><rect x="880" y="190" width="160" height="70" rx="14" fill="#DBEAFE" stroke="#CBD5E1"/><rect x="880" y="190" width="6" height="70" rx="3" fill="#2563EB"/><text x="898" y="218" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start">MSC</text><text x="898" y="243" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Switching &amp; mobility</text><rect x="880" y="330" width="160" height="70" rx="14" fill="#EDE9FE" stroke="#CBD5E1"/><rect x="880" y="330" width="6" height="70" rx="3" fill="#7C3AED"/><text x="898" y="358" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#7C3AED" text-anchor="start">HLR / VLR</text><text x="898" y="383" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Subscriber databases</text><rect x="1110" y="190" width="160" height="70" rx="14" fill="#DCFCE7" stroke="#CBD5E1"/><rect x="1110" y="190" width="6" height="70" rx="3" fill="#15803D"/><text x="1128" y="218" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#15803D" text-anchor="start">PSTN</text><text x="1128" y="243" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Fixed telephone network</text><path d="M810 225 L880 225" stroke="#0891B2" stroke-width="3" fill="none"/><path d="M960 260 L960 330" stroke="#7C3AED" stroke-width="3" fill="none"/><path d="M1040 225 L1110 225" stroke="#15803D" stroke-width="3" fill="none"/><text x="835" y="214" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#172033" text-anchor="start">Abis</text><text x="1050" y="214" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#172033" text-anchor="start">A interface</text><rect x="650" y="490" width="280" height="105" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="650" y="490" width="6" height="105" rx="3" fill="#15803D"/><text x="668" y="518" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#15803D" text-anchor="start">Mobile Station (MS)</text><text x="668" y="543" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Handset plus SIM; initiates and receives calls over the air interface.</text><rect x="960" y="490" width="250" height="105" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="960" y="490" width="6" height="105" rx="3" fill="#2563EB"/><text x="978" y="518" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start">BTS</text><text x="978" y="543" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Radio transceiver that serves one cell.</text><rect x="650" y="625" width="280" height="105" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="650" y="625" width="6" height="105" rx="3" fill="#0891B2"/><text x="668" y="653" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#0891B2" text-anchor="start">BSC</text><text x="668" y="678" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Controls several BTSs; channel allocation and handoff.</text><rect x="960" y="625" width="250" height="105" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="960" y="625" width="6" height="105" rx="3" fill="#7C3AED"/><text x="978" y="653" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#7C3AED" text-anchor="start">MSC</text><text x="978" y="678" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Call set-up, switching, mobility management.</text><rect x="650" y="760" width="280" height="105" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="650" y="760" width="6" height="105" rx="3" fill="#7C3AED"/><text x="668" y="788" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#7C3AED" text-anchor="start">HLR / VLR</text><text x="668" y="813" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Permanent and visited-area subscriber databases.</text><rect x="960" y="760" width="250" height="105" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="960" y="760" width="6" height="105" rx="3" fill="#15803D"/><text x="978" y="788" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#15803D" text-anchor="start">PSTN</text><text x="978" y="813" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Fixed telephone network for external calls.</text><text x="45" y="940" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#64748B" text-anchor="start">Prototype: create Hidden / Visible info-card variants; click a block to show its function.</text></svg>