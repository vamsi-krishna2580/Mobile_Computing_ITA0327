<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950"><rect width="100%" height="100%" fill="#F5F7FB"/><text x="40" y="48" font-family="Inter,Arial" font-size="30" font-weight="700" fill="#172033">03 · Network Switching Subsystem (NSS)</text><text x="42" y="78" font-family="Inter,Arial" font-size="15" fill="#64748B">Mobile-originated (MO) and mobile-terminated (MT) call flow</text><path d="M40 100 H1400" stroke="#CBD5E1"/><text x="45" y="140" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#2563EB" text-anchor="start">MOBILE-ORIGINATED (MO) CALL</text><rect x="45" y="185" width="200" height="72" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="145.0" y="226.0" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">MS call request</text><rect x="290" y="185" width="200" height="72" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="390.0" y="226.0" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">BSS → MSC</text><path d="M245 221 L290 221" stroke="#94A3B8" stroke-width="2" fill="none"/><rect x="535" y="185" width="200" height="72" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="635.0" y="226.0" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">MSC asks VLR</text><path d="M490 221 L535 221" stroke="#94A3B8" stroke-width="2" fill="none"/><rect x="780" y="185" width="200" height="72" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="880.0" y="226.0" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">Registered &amp; allowed?</text><path d="M735 221 L780 221" stroke="#94A3B8" stroke-width="2" fill="none"/><rect x="1060" y="185" width="220" height="72" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/><text x="1170.0" y="226.0" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="middle">NO · Reject call</text><rect x="1060" y="290" width="220" height="72" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="1170.0" y="331.0" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">YES · Authenticate</text><rect x="45" y="315" width="290" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="45" y="315" width="6" height="110" rx="3" fill="#7C3AED"/><text x="63" y="343" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#7C3AED" text-anchor="start">HLR / AuC</text><text x="63" y="368" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">VLR obtains authentication triplets; MS is authenticated.</text><rect x="365" y="315" width="250" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="365" y="315" width="6" height="110" rx="3" fill="#B45309"/><text x="383" y="343" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#B45309" text-anchor="start">EIR</text><text x="383" y="368" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Checks IMEI: valid, stolen or faulty.</text><rect x="645" y="315" width="360" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="645" y="315" width="6" height="110" rx="3" fill="#0891B2"/><text x="663" y="343" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#0891B2" text-anchor="start">Routing decision</text><text x="663" y="368" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Called party in PSTN or mobile network? Route via PSTN or GMSC.</text><text x="45" y="500" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">MO call proceeds to Call Connected → Call Release → End.</text><text x="45" y="590" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#7C3AED" text-anchor="start">MOBILE-TERMINATED (MT) CALL</text><rect x="45" y="640" width="185" height="78" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="137.5" y="684.0" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">Incoming call</text><rect x="265" y="640" width="185" height="78" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="357.5" y="684.0" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">GMSC → HLR / (Send Routing Info)</text><path d="M230 679 L265 679" stroke="#7C3AED" stroke-width="2" fill="none"/><rect x="485" y="640" width="185" height="78" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="577.5" y="684.0" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">HLR asks serving / VLR / MSC for MSRN</text><path d="M450 679 L485 679" stroke="#7C3AED" stroke-width="2" fill="none"/><rect x="705" y="640" width="185" height="78" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="797.5" y="684.0" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">GMSC routes to MSC</text><path d="M670 679 L705 679" stroke="#7C3AED" stroke-width="2" fill="none"/><rect x="925" y="640" width="185" height="78" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="1017.5" y="684.0" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">MSC pages MS</text><path d="M890 679 L925 679" stroke="#7C3AED" stroke-width="2" fill="none"/><rect x="1145" y="640" width="185" height="78" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="1237.5" y="684.0" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">MS answers</text><path d="M1110 679 L1145 679" stroke="#7C3AED" stroke-width="2" fill="none"/><text x="45" y="830" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">Prototype: label decision arrows YES / NO; use different colours for MO and MT paths.</text></svg>