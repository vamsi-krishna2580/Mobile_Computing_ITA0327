<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="100%" height="100%" fill="#F5F7FB"/><text x="40" y="48" font-family="Inter,Arial" font-size="30" font-weight="700" fill="#172033">02 · Evolution from 1G to 5G</text><text x="42" y="78" font-family="Inter,Arial" font-size="15" fill="#64748B">Five-stage timeline · generation, year, technology, access, data rate and key feature</text><path d="M40 100 H1400" stroke="#CBD5E1"/><path d="M125 245 L1310 245" stroke="#2563EB" stroke-width="5" fill="none"/><circle cx="150" cy="245" r="34" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="150" y="251" font-family="Inter,Arial" font-size="19" font-weight="700" fill="#2563EB" text-anchor="middle">1G</text><rect x="45" y="315" width="235" height="340" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="45" y="315" width="6" height="340" rx="3" fill="#2563EB"/><text x="63" y="343" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start">1G · 1980s</text><text x="63" y="368" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">AMPS (analog)</text><text x="63" y="388" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Access: FDMA</text><text x="63" y="408" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Peak rate: about 2.4 kbps</text><text x="63" y="428" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Analog voice only</text><circle cx="430" cy="245" r="34" fill="#CFFAFE" stroke="#2563EB" stroke-width="2"/><text x="430" y="251" font-family="Inter,Arial" font-size="19" font-weight="700" fill="#2563EB" text-anchor="middle">2G</text><rect x="325" y="315" width="235" height="340" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="325" y="315" width="6" height="340" rx="3" fill="#0891B2"/><text x="343" y="343" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#0891B2" text-anchor="start">2G · 1990s</text><text x="343" y="368" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">GSM, GPRS, EDGE</text><text x="343" y="388" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Access: TDMA/FDMA</text><text x="343" y="408" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Peak rate: up to 384 kbps</text><text x="343" y="428" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Digital voice, SMS</text><circle cx="710" cy="245" r="34" fill="#EDE9FE" stroke="#2563EB" stroke-width="2"/><text x="710" y="251" font-family="Inter,Arial" font-size="19" font-weight="700" fill="#2563EB" text-anchor="middle">3G</text><rect x="605" y="315" width="235" height="340" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="605" y="315" width="6" height="340" rx="3" fill="#7C3AED"/><text x="623" y="343" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#7C3AED" text-anchor="start">3G · 2000s</text><text x="623" y="368" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">UMTS, HSPA</text><text x="623" y="388" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Access: WCDMA</text><text x="623" y="408" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Peak rate: 2 to 42 Mbps</text><text x="623" y="428" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Mobile internet, video calls</text><circle cx="990" cy="245" r="34" fill="#DCFCE7" stroke="#2563EB" stroke-width="2"/><text x="990" y="251" font-family="Inter,Arial" font-size="19" font-weight="700" fill="#2563EB" text-anchor="middle">4G</text><rect x="885" y="315" width="235" height="340" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="885" y="315" width="6" height="340" rx="3" fill="#15803D"/><text x="903" y="343" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#15803D" text-anchor="start">4G · 2010s</text><text x="903" y="368" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">LTE, LTE-Advanced</text><text x="903" y="388" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Access: OFDMA / SC-FDMA</text><text x="903" y="408" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Peak rate: 100 Mbps to 1 Gbps</text><text x="903" y="428" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">All-IP, HD streaming</text><circle cx="1270" cy="245" r="34" fill="#FEF3C7" stroke="#2563EB" stroke-width="2"/><text x="1270" y="251" font-family="Inter,Arial" font-size="19" font-weight="700" fill="#2563EB" text-anchor="middle">5G</text><rect x="1165" y="315" width="235" height="340" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="1165" y="315" width="6" height="340" rx="3" fill="#B45309"/><text x="1183" y="343" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#B45309" text-anchor="start">5G · 2020s</text><text x="1183" y="368" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">New Radio (NR)</text><text x="1183" y="388" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Access: OFDMA, massive MIMO</text><text x="1183" y="408" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Peak rate: up to 20 Gbps (target)</text><text x="1183" y="428" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Low latency, IoT, network slicing</text><text x="45" y="720" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">Prototype: click a card to expand; hover to highlight; Next / Previous navigate between generation frames.</text></svg>