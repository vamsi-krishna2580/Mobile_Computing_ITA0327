 Computing</text><rect x="85" y="348" width="180" height="65" fill="#FFFFFF" stroke="#CBD5E1"/><text x="95" y="386" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#172033" text-anchor="start">Focus</text><rect x="265" y="348" width="520" height="65" fill="#FFFFFF" stroke="#CBD5E1"/><text x="275" y="386" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#172033" text-anchor="start">Transmission of voice and data</text><rect x="785" y="348" width="560" height="65" fill="#FFFFFF" stroke="#CBD5E1"/><text x="795" y="386" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#172033" text-anchor="start">Processing and accessing information on the move</text><rect x="85" y="413" width="180" height="65" fill="#EEF2F7" stroke="#CBD5E1"/><text x="95" y="451" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#172033" text-anchor="start">Main issues</text><rect x="265" y="413" width="520" height="65" fill="#EEF2F7" stroke="#CBD5E1"/><text x="275" y="451" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#172033" text-anchor="start">Spectrum, handoff, interference</text><rect x="785" y="413" width="560" height="65" fill="#EEF2F7" stroke="#CBD5E1"/><text x="795" y="451" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#172033" text-anchor="start">Energy, security, disconnection, data consistency</text><rect x="85" y="478" width="180" height="65" fill="#FFFFFF" stroke="#CBD5E1"/><text x="95" y="516" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#172033" text-anchor="start">Technologies</text><rect x="265" y="478" width="520" height="65" fill="#FFFFFF" stroke="#CBD5E1"/><text x="275" y="516" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#172033" text-anchor="start">GSM, LTE, 5G, Wi-Fi</text><rect x="785" y="478" width="560" height="65" fill="#FFFFFF" stroke="#CBD5E1"/><text x="795" y="516" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#1